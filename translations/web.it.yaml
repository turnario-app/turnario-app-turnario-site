    features:
        calendar:
            title: Calendario dei turni
            body: I turni della tua turnazione per mesi e anni, con i colori di mattina, pomeriggio, sera, notte e riposo, e i festivi in evidenza.
            points:
                1: Turnazioni pronte per Polizia di Stato, Vigili del Fuoco, Carabinieri e Sanità
                2: Turnazioni personali e cambi di turnazione nel tempo
                3: Festivi nazionali e ricorrenze sempre aggiornati
        diary:
            title: Ferie, permessi e straordinari
            body: Su ogni giorno segni attività e note. Un periodo di ferie si aggiunge in un colpo solo, su più giorni.
            points:
                1: Attività con orari, durata e note
                2: Inserimento su un intervallo di giorni
                3: Il giorno mostra turno e attività insieme
        types:
            title: Tipi di attività tuoi
            body: Oltre ai tipi già pronti puoi creare i tuoi, con il nome e il colore che vuoi.
            points:
                1: Tipi già pronti per ferie, permessi e recuperi
                2: Colori scelti da te nel calendario
                3: Ogni tipo può scalare o aggiungere ore e giorni alla banca
        year_banks:
            title: Banca ore e giorni
            body: Turnario tiene il conto di quanto hai a disposizione e di quanto hai già usato, anno per anno.
            points:
                1: Dotazione annuale e ripartenza a inizio anno
                2: Saldo aggiornato a ogni attività
                3: Correzioni a mano quando serve
        reports:
            title: Report ed export CSV
            body: Il riepilogo del mese o dell'anno con turni, attività e ore, da leggere nell'app o da scaricare.
            points:
                1: Totali per tipo di attività
                2: Export CSV da aprire con un foglio di calcolo
                3: Utile per controllare la busta paga
        earnings:
            title: Quanto ti spetta, in euro
            body: Inserisci le tue tariffe e Turnario stima quanto valgono straordinari, vigilanze e le altre attività del periodo, e quanto manca ancora in busta paga.
            points:
                1: Tariffa oraria o a presenza per ogni tipo di attività
                2: Totale pagato e da pagare del mese o dell'anno
                3: Una stima da confrontare con il cedolino
        devices:
            title: Su telefono e sul web
            body: Lo stesso account su iPhone, Android e browser. Quello che segni su un dispositivo lo trovi sugli altri.
            points:
                1: App per iPhone e Android
                2: App web da qualsiasi computer
                3: Accesso con email, Apple o Google
        import:
            title: Dalle vecchie app Turnario
            body: Se usavi le vecchie app Turnario su iPhone porti con te i tuoi dati, e paghi Pro a prezzo ridotto.
            points:
                1: Import dei giorni, delle attività e dei tipi
                2: Prezzi ridotti per chi arriva dalle vecchie app
                3: Nessun dato perso nel passaggio
        privacy:
            title: I tuoi dati restano tuoi
            body: Il servizio e i dati sono ospitati nell'Unione europea. Non vendiamo i tuoi dati e non mostriamo pubblicità.
            points:
