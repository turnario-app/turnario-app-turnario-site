    support:
        title: Supporto di Turnario
        description: Risposte alle domande più frequenti su Turnario, gli abbonamenti, i dati e l'account.
        headline: Come possiamo aiutarti?
        intro: Qui trovi le risposte alle domande più frequenti. Se non trovi la tua, scrivici.
        contact:
            title: Non hai trovato la risposta?
            body: Scrivici e ti rispondiamo il prima possibile.
            delete: Vuoi eliminare il tuo account?
    faq:
        title: Domande frequenti
        free:
            q: Turnario è gratis?
            a: Sì. Il calendario dei turni, le turnazioni, i festivi e le app su tutti i dispositivi sono gratis. Pro aggiunge il diario delle attività, i tipi personali, le banche ore e giorni, i report e la stima in euro di straordinari e attività.
        pattern:
            q: La mia turnazione non c'è, cosa faccio?
            a: Puoi creare una turnazione personale con la sequenza dei tuoi turni e il giorno di partenza. Il calendario si aggiorna da solo.
        devices:
            q: Posso usare lo stesso account su telefono e computer?
            a: Sì. Accedi con lo stesso account sull'app per iPhone, su quella per Android e sull'app web e trovi gli stessi dati ovunque.
        import:
            q: Usavo le vecchie app Turnario, perdo i miei dati?
            a: No. La nuova app per iPhone importa i dati delle vecchie app Turnario, e chi importa paga Pro a prezzo ridotto. Chi non può importare può avere gli stessi prezzi con un codice invito.
        trial:
            q: Come funziona la prova gratuita?
            a: I piani mensile e annuale partono con %days% giorni di prova. Se disdici prima della fine della prova non paghi nulla.
        cancel:
            q: Come disdico l'abbonamento?
            a: Dalla pagina Abbonamento dell'app, quando vuoi. Pro resta attivo fino alla fine del periodo già pagato.
        payment:
            q: Come posso pagare?
            a: Con carta, tramite Stripe, il fornitore dei pagamenti. I dati della carta li tratta Stripe, non noi.
        loyal:
            q: Chi ha diritto ai prezzi ridotti?
            a: Chi importa i dati delle vecchie app Turnario o usa un codice invito. Il prezzo ridotto si vede nella pagina Abbonamento dell'app.
        data:
            q: Dove sono i miei dati?
            a: Su server nell'Unione europea. Dall'app puoi scaricare una copia completa dei tuoi dati quando vuoi. Trovi tutti i dettagli nell'informativa sulla privacy.
        delete:
            q: Come elimino il mio account?
            a: Dall'app, nella scheda Profilo, oppure dalla pagina Elimina account di questo sito se non hai più l'app. L'eliminazione cancella tutti i tuoi dati.
