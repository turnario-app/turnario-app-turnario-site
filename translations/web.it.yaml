delete_account:
    title: Elimina il tuo account Turnario
    intro: Puoi eliminare il tuo account Turnario e tutti i dati collegati in qualsiasi momento, gratis e senza dover reinstallare l'app.
    in_app:
        title: Dall'app
        body: Apri Turnario sul telefono o sul web, vai nella scheda Profilo e tocca "Elimina account". L'eliminazione è immediata.
    on_web:
        title: Da questa pagina
        body: Se non hai più l'app, scrivi l'indirizzo email del tuo account. Ti mandiamo un link per confermare la cancellazione, così nessun altro può eliminare il tuo account.
    deleted:
        title: Cosa viene eliminato
        body: Subito e per sempre il profilo, la foto, i giorni con note e attività, i tipi personali, le turnazioni, le banche ore e giorni, i dispositivi e le notifiche, gli account Apple e Google collegati e le sessioni aperte. Togliamo anche il tuo indirizzo dalla lista delle comunicazioni promozionali.
    kept:
        title: Cosa resta
        body: Restano solo i dati che la legge ci obbliga a conservare, cioè quelli fiscali degli acquisti fatti con il pagamento sul web, conservati da Stripe, il fornitore dei pagamenti, per il tempo previsto dalla legge. Gli abbonamenti comprati su App Store o Google Play non si disdicono da soli, disdicili dalle impostazioni del tuo account Apple o Google.
    email: Email del tuo account
    button: Inviami il link di conferma
    invalid_email: Scrivi un indirizzo email valido.
    sent:
        title: Controlla la tua email
        body: Se esiste un account Turnario con questo indirizzo, ti abbiamo mandato un link per confermare la cancellazione. Il link vale %minutes% minuti. Se non trovi l'email, guarda anche nella posta indesiderata.
    contact: Per qualsiasi problema scrivi a %email%.

confirm_deletion:
    title: Confermi la cancellazione?
    intro: Toccando il pulsante il tuo account Turnario e tutti i tuoi dati saranno eliminati per sempre. Non si può annullare.
    button: Elimina definitivamente
    done:
        title: Account eliminato
        body: Abbiamo eliminato il tuo account Turnario e tutti i dati collegati. Ti abbiamo mandato un'email di conferma.
    invalid:
        title: Link non valido
        body: Il link non è valido, è già stato usato oppure è scaduto. Chiedi un nuovo link dalla pagina di cancellazione dell'account.

