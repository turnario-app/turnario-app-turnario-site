    intro: Tap the button to confirm this address is yours.
    button: Confirm my address
    done:
        title: Address confirmed
        body: Thank you, your email address is confirmed. You can go back to the app.
    invalid:
        title: Invalid link
        body: The link is not valid, was already used or has expired. Ask for a new confirmation email in the app.

reset_password:
    title: Choose a new password
    intro: The password needs at least %min% characters. After the change you will have to sign in again on every device.
    password: New password
    confirmation: Repeat the new password
    button: Save the password
    mismatch: The two passwords are not the same.
    length: The password needs %min% to %max% characters.
    done:
        title: Password changed
        body: The new password is saved. Go back to the app and sign in with it.
    invalid:
        title: Invalid link
        body: The link is not valid, was already used or has expired. Ask for a new email with "Forgot password" on the sign-in screen of the app.

delete_account:
    title: Delete your Turnario account
    intro: You can delete your Turnario account and all the data linked to it at any time, for free and without reinstalling the app.
    in_app:
        title: From the app
        body: Open Turnario on your phone or on the web, go to the Profile tab and tap "Delete account". The deletion is immediate.
    on_web:
        title: From this page
        body: If you no longer have the app, enter the email address of your account. We send you a link to confirm the deletion, so nobody else can delete your account.
    deleted:
        title: What is deleted
        body: At once and for good your profile, photo, days with notes and activities, personal types, shift patterns, hour and day banks, devices and notifications, linked Apple and Google accounts and open sessions. We also remove your address from the promotional mailing list.
    kept:
        title: What is kept
        body: Only the data the law requires us to keep, that is the tax records of purchases paid on the web, kept by Stripe, our payment provider, for as long as the law requires. Subscriptions bought on the App Store or Google Play are not cancelled by this, so cancel them from your Apple or Google account settings.
    email: Email of your account
    button: Send me the confirmation link
    invalid_email: Enter a valid email address.
    sent:
        title: Check your email
        body: If a Turnario account exists with this address, we sent it a link to confirm the deletion. The link works for %minutes% minutes. If you cannot find the email, check your spam folder too.
    contact: For any problem write to %email%.

confirm_deletion:
    title: Do you confirm the deletion?
    intro: When you tap the button your Turnario account and all your data will be deleted for good. This cannot be undone.
    button: Delete for good
    done:
        title: Account deleted
        body: We deleted your Turnario account and all the data linked to it. We sent you a confirmation email.
    invalid:
        title: Invalid link
        body: The link is not valid, was already used or has expired. Ask for a new link from the account deletion page.

