    home:
        title: Turnario, your shift calendar
        description: Turnario works out the shifts of your rota and keeps count of leave, permits, overtime and hour banks. For the Police, Fire Brigade, Carabinieri and Healthcare, on iPhone, Android and the web.
        eyebrow: For shift workers
        headline: Your <strong>shifts</strong>, <strong>leave</strong> and <strong>hours</strong> in one calendar.
        intro: Pick your rota and Turnario draws your shifts for the whole year. Mark leave, permits and overtime, and always know how many days and hours you have left.
        price_note: The shift calendar is free. Pro starts at %price% a month, with a %days%-day trial.
        corps:
            title: Made for your job
            body: The most common rotas of every corps are ready, with public holidays. If yours is different, you create it.
        values:
            label: Why Turnario
            automatic:
                title: Shifts work themselves out
                body: Set your rota once and see your shifts for months and years, even when it changes.
            everything:
                title: All in one place
                body: Leave, permits, time off in lieu, overtime and notes stay on the day they happened.
            everywhere:
                title: Always with you
                body: On your phone on duty, on your computer at home. The data is the same everywhere.
        steps:
            eyebrow: How it works
            title: Three steps and your year is in order
            pattern:
                title: Pick your rota
                body: Choose your corps and rota, or create your own. The calendar fills itself in.
            mark:
                title: Mark what happens
                body: Add leave, permits or overtime on one day or several at once, with your own types and colours.
            count:
                title: Keep count
                body: Hour and day banks update with every activity. At the end of the month your report is ready, in CSV too.
        features:
            title: Everything you need, nothing more
            more: See all features
        prices:
            title: Free for shifts, Pro for everything else
            body: Try Pro with no commitment and pick the plan you prefer.
            more: Compare Basic and Pro
    features:
        calendar:
            title: Shift calendar
            body: The shifts of your rota for months and years, coloured by morning, afternoon, evening, night and rest, with public holidays highlighted.
            points:
                1: Ready-made rotas for the Police, Fire Brigade, Carabinieri and Healthcare
                2: Personal rotas and rota changes over time
                3: National public holidays always up to date
        diary:
            title: Leave, permits and overtime
            body: Mark activities and notes on every day. A stretch of leave goes in at once, over several days.
            points:
                1: Activities with times, duration and notes
                2: Entry over a range of days
                3: Each day shows shift and activities together
        types:
            title: Your own activity types
            body: Besides the ready-made types you can create your own, with the name and colour you like.
            points:
                1: Ready-made types for leave, permits and time off
                2: Colours of your choice in the calendar
                3: Each type can take or add hours and days to the bank
        year_banks:
            title: Hour and day banks
            body: Turnario keeps count of what you have and what you have already used, year by year.
            points:
                1: Yearly allowance and carry-over at the start of the year
                2: Balance updated with every activity
                3: Manual corrections when needed
        reports:
            title: Reports and CSV export
            body: A summary of the month or the year with shifts, activities and hours, to read in the app or download.
            points:
                1: Totals by activity type
                2: CSV export to open in a spreadsheet
                3: Handy to check your payslip
        earnings:
            title: What you are owed, in euros
            body: Enter your own rates and Turnario estimates what overtime, extra duties and the other activities of the period are worth, and how much your payslip still owes you.
            points:
                1: Hourly or per-entry rate for each activity type
                2: Paid and unpaid totals for the month or the year
                3: An estimate to check against your payslip
        devices:
            title: On your phone and the web
            body: The same account on iPhone, Android and the browser. What you mark on one device you find on the others.
            points:
                1: Apps for iPhone and Android
                2: Web app from any computer
                3: Sign in with email, Apple or Google
        import:
            title: From the old Turnario apps
            body: If you used the old Turnario apps on iPhone you bring your data with you, and pay a reduced price for Pro.
            points:
                1: Import of days, activities and types
                2: Reduced prices for those coming from the old apps
                3: No data lost in the move
        privacy:
            title: Your data stays yours
            body: The service and the data are hosted in the European Union. We do not sell your data and show no ads.
            points:
                1: A full copy of your data whenever you want
                2: Account deletion from the app or the website
                3: Marketing emails only with your consent
