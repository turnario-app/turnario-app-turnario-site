                items:
                    1: Five-day cycle, on even or odd days
                    2: Four and three-day cycles
                    3: Continuous evening, afternoon and morning
                    4: Pattern changes over time, history kept
            needs:
                title: Keep count of your duty
                body: Each day shows the shift and what happened. Hour and day banks update on their own.
                items:
                    1: Leave, rest days and time off in lieu
                    2: Overtime with times and duration
                    3: Hour and day banks, year by year
                    4: Monthly CSV report, handy to check your payslip
            faq:
                1:
                    q: Are the even and odd five-day cycles there?
                    a: Yes. The five-day cycle is ready on both even and odd days, along with the four and three-day cycles and the continuous one. Pick the start day and the calendar fills itself.
                2:
                    q: Can I track leave and overtime?
                    a: Yes. On each day add leave, time off in lieu, overtime and permits with times and notes. With Pro the hour and day banks update with every activity.
                3:
                    q: How much does Turnario cost?
                    a: The shift calendar is free. Pro costs from %price% a month, with a %days%-day trial.
        ts:
            link: Nurse and healthcare shifts
            title: Nurse and care worker shifts, the hospital shift calendar | Turnario
            description: The shift calendar for nurses, care workers and healthcare staff with the five-day cycle, morning, afternoon, night and post-night. Track leave, nights and overtime. On iPhone, Android and the web.
