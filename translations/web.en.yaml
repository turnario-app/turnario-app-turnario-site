    support:
        title: Turnario support
        description: Answers to the most frequent questions about Turnario, subscriptions, data and your account.
        headline: How can we help?
        intro: Here are the answers to the most frequent questions. If yours is not here, write to us.
        contact:
            title: Didn't find the answer?
            body: Write to us and we will get back to you as soon as we can.
            delete: Want to delete your account?
    faq:
        title: Frequently asked questions
        free:
            q: Is Turnario free?
            a: Yes. The shift calendar, the rotas, public holidays and the apps on every device are free. Pro adds the activity diary, personal types, hour and day banks, reports and an estimate in euros of overtime and activities.
        pattern:
            q: My rota is not there, what do I do?
            a: You can create a personal rota with the sequence of your shifts and its start day. The calendar updates by itself.
        devices:
            q: Can I use the same account on my phone and computer?
            a: Yes. Sign in with the same account on the iPhone app, the Android app and the web app and you find the same data everywhere.
        import:
            q: I used the old Turnario apps, do I lose my data?
            a: No. The new iPhone app imports the data of the old Turnario apps, and those who import pay a reduced price for Pro. Those who cannot import can get the same prices with an invite code.
        trial:
            q: How does the free trial work?
            a: The monthly and yearly plans start with a %days%-day trial. If you cancel before it ends you pay nothing.
        cancel:
            q: How do I cancel my subscription?
            a: From the Subscription page of the app, whenever you want. Pro stays active until the end of the period already paid.
        payment:
            q: How can I pay?
            a: By card, through Stripe, our payment provider. Your card details are handled by Stripe, not by us.
        loyal:
            q: Who gets the reduced prices?
            a: Those who import the data of the old Turnario apps or use an invite code. The reduced price shows on the Subscription page of the app.
        data:
            q: Where is my data?
            a: On servers in the European Union. From the app you can download a full copy of your data whenever you want. All the details are in the privacy policy.
        delete:
            q: How do I delete my account?
            a: From the app, in the Profile tab, or from the Delete account page of this website if you no longer have the app. Deletion removes all your data.
