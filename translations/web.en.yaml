        ps:
            link: State Police shifts
            title: State Police shifts, the calendar for five, four and three-day cycles | Turnario
            description: The shift calendar for the Italian State Police with five, four and three-day cycles and continuous patterns. Track leave, rest days, time off in lieu and overtime. On iPhone, Android and the web.
            eyebrow: For the State Police
            headline: Your <strong>police shifts</strong>, always in your pocket.
            intro: Pick your pattern and Turnario draws your duty for the whole year, with holidays, rest days and post-night days. Track leave, time off in lieu and overtime and always know what you have left.
            patterns:
                title: Police shift patterns, ready to use
                body: The patterns most used in offices and units are already in the app. If yours is different you create it, with its sequence and start day.
                items:
                    1: Five-day cycle, evening, afternoon, morning, night and rest
                    2: Four and three-day cycles
                    3: Continuous morning and afternoon, weekly and alternating
                    4: Pattern changes over time, history kept
            needs:
                title: Keep count of your duty
                body: Each day shows the shift and what happened. Hour and day banks update on their own.
                items:
                    1: Annual leave, rest days and time off in lieu
                    2: Overtime with times and duration
                    3: Hour and day banks, year by year
                    4: Monthly CSV report, handy to check your payslip
            faq:
                1:
                    q: Is the police five-day cycle there?
                    a: Yes. The five-day cycle (evening, afternoon, morning, night, rest) is ready, along with the four and three-day cycles and the continuous ones. Pick the start day and the calendar fills itself.
                2:
                    q: Can I track overtime and time off in lieu?
                    a: Yes. On each day add overtime, time off in lieu, leave and permits with times and notes. With Pro the hour and day banks update with every activity.
                3:
                    q: How much does Turnario cost?
                    a: The shift calendar is free. Pro costs from %price% a month, with a %days%-day trial.
        vvf:
            link: Fire Brigade shifts
            title: Fire Brigade shifts, the calendar for sections A, B, C and D | Turnario
            description: The shift calendar for the Italian Fire Brigade with day, night, post-night and rest, sections A, B, C and D and the 24-hour shift. Track overtime and wildfire duty. On iPhone, Android and the web.
            eyebrow: For the Fire Brigade
            headline: Your <strong>firefighter shifts</strong>, section by section.
            intro: Pick your section and Turnario works out day, night, post-night and rest for the whole year. Track overtime, wildfire duty and leave and keep count of your hours.
            patterns:
                title: The Fire Brigade shift, ready to use
                body: The national cycle and the section views are already in the app, with the right start date. If your command does it differently you create your own pattern.
                items:
                    1: Day, night, post-night and rest
                    2: Sections A, B, C and D, also in pairs
                    3: 24-hour shift
                    4: M3 shifts on weekdays
            needs:
                title: Keep count of your hours
                body: Each day shows the shift of your section and what you did. Hour banks update on their own.
                items:
                    1: Overtime and call-backs
                    2: Wildfire duty and activities with times and notes
                    3: Leave and time off in lieu, with the year balance
                    4: Monthly CSV report
            faq:
                1:
                    q: Is my section's shift there?
                    a: Yes. Sections A, B, C and D are ready, alone or in pairs, along with the day, night, post-night and rest cycle and the 24-hour shift.
                2:
                    q: Can I track overtime and wildfire duty?
                    a: Yes. On each day add overtime, wildfire duty, leave and time off in lieu with times and notes. With Pro the hour bank updates with every activity.
                3:
                    q: How much does Turnario cost?
                    a: The shift calendar is free. Pro costs from %price% a month, with a %days%-day trial.
        cc:
            link: Carabinieri shifts
            title: Carabinieri shifts, the calendar for even and odd five-day cycles | Turnario
            description: The shift calendar for the Carabinieri with even and odd five-day cycles, four and three-day cycles. Track leave, rest days, time off in lieu and overtime. On iPhone, Android and the web.
            eyebrow: For the Carabinieri
            headline: Your <strong>Carabinieri shifts</strong>, day by day.
            intro: Pick your pattern and Turnario draws your duty for the whole year, with holidays and rest days. Track leave, time off in lieu and overtime and always know what you have left.
            patterns:
